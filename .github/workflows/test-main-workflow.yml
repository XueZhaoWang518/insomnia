name: Main Workflow Test

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main-workflow-smoke 
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'

      - name: Install packages
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patches
        run: npx patch-package

      - name: Build app for smoke tests
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-build

      - name: Run main workflow test
        run: npm run test:build -w packages/insomnia-smoke-test -- --project=Main

      - name: Upload main test traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: ${{ matrix.os }}-main-workflow-traces-${{ github.run_number }}
          path: packages/insomnia-smoke-test/traces

      - name: Upload main test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: ${{ matrix.os }}-main-workflow-report-${{ github.run_number }}
          path: packages/insomnia-smoke-test/playwright-report
